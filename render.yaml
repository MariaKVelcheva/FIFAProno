services:
  - type: web
    name: world-cupcake
    env: python
    runtime: python
    pythonVersion: "3.12.4"
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate
    startCommand: gunicorn config.wsgi
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: world-cupcake.onrender.com
      - key: FOOTBALL_DATA_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: world-cupcake-db
          property: connectionString

databases:
  - name: world-cupcake-db
    plan: free